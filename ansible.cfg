# ============================================================================
# ansible.cfg — Project-local Ansible configuration for the K8s lab.
# ----------------------------------------------------------------------------
# Ansible automatically picks up this file when run from the project root
# (lookup order: ANSIBLE_CONFIG env var, ./ansible.cfg, ~/.ansible.cfg,
# /etc/ansible/ansible.cfg). Keeping this in the repo means every clone
# of the project gets the same Ansible behavior.
# ============================================================================

[defaults]

# Path to the inventory file, relative to this config. Avoids the need to
# pass -i on every ansible/ansible-playbook command.
inventory = ansible/inventory/hosts.ini

# Skip SSH host key verification. Safe here because:
#   - VMs live in the WSL2 NAT segment, not on the public internet.
#   - VM IPs change between Multipass daemon restarts, so a stable
#     known_hosts file would constantly trigger false alarms.
# Production environments should keep this 'True' and manage known_hosts
# properly via configuration management.
host_key_checking = False

# Format task output as YAML instead of the default compact JSON.
# Replaces the legacy 'yaml' callback plugin (removed in Ansible 2.21).
result_format = yaml

# 'smart' gathering only collects facts (ansible_facts.*) if they are not
# already cached. Combined with fact_caching below, this avoids the ~2-3s
# of fact-gathering overhead on every playbook run.
gathering = smart

# Cache gathered facts to disk as JSON. Subsequent runs can reuse them
# without re-querying the target nodes.
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible-fact-cache

# Cached facts older than 24 hours (86400 seconds) are considered stale
# and re-collected on the next run.
fact_caching_timeout = 86400

# Suppress the warning Ansible would otherwise print when auto-detecting
# the Python interpreter on the target. We already pin it in the inventory
# (ansible_python_interpreter=/usr/bin/python3), so the warning is noise.
interpreter_python = auto_silent

# Disable .retry files (Ansible writes one when a play fails). They are
# rarely useful in a small lab and clutter the project tree, where they
# also risk being committed by mistake.
retry_files_enabled = False


[ssh_connection]

# Combine multiple Ansible module operations into a single SSH session
# instead of opening a new connection per task. Major speedup (~30%) on
# playbooks with many small tasks. Requires 'requiretty' to be disabled
# in sudoers on the target — true here because of NOPASSWD:ALL (ADR-005).
pipelining = True

# Reuse SSH connections via ControlMaster. Each target+user+port combination
# gets one persistent connection that subsequent tasks reuse. The %%h %%p %%r
# placeholders are doubled because Ansible itself does one round of %-expansion
# before passing the value to SSH (which does another round).
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

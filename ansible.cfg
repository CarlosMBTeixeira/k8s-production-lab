# ============================================================================
# ansible.cfg — Project-local Ansible configuration for the K8s lab.
# ----------------------------------------------------------------------------
# Ansible automatically picks up this file when run from the project root
# (lookup order: ANSIBLE_CONFIG env var, ./ansible.cfg, ~/.ansible.cfg,
# /etc/ansible/ansible.cfg). Keeping this in the repo means every clone
# of the project gets the same Ansible behavior.
# ============================================================================

[defaults]
inventory = ansible/inventory/hosts.ini
roles_path = ansible/roles
host_key_checking = False
result_format = yaml
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible-fact-cache
fact_caching_timeout = 86400
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

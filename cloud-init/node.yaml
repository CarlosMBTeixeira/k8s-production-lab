#cloud-config
# Cloud-init template for Kubernetes lab nodes
# Render with: envsubst < cloud-init/node.yaml > rendered.yaml
# Required environment variables: HOSTNAME

hostname: ${HOSTNAME}

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: sudo
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINKkl8bQ/AokcBBBf6KIdDE1nDWpOX/auyyCpdibXSdl k8slab

  - name: ansible
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: sudo
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINKkl8bQ/AokcBBBf6KIdDE1nDWpOX/auyyCpdibXSdl k8slab

runcmd:
  - swapoff -a
  - sed -i '/swap/s/^/#/' /etc/fstab

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - htop
  - net-tools
  - vim
  - jq

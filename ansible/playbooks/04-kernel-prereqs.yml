---
# ============================================================================
# 04-kernel-prereqs.yml — Apply kernel prerequisites via the kernel-prereqs role.
# ----------------------------------------------------------------------------
# Thin wrapper that invokes the kernel-prereqs role on all K8s nodes.
# The actual logic lives in roles/kernel-prereqs/.
# ============================================================================

- name: Apply kernel prerequisites for Kubernetes
  hosts: k8s_cluster
  become: true
  gather_facts: false

  roles:
    - kernel-prereqs

---
# ============================================================================
# 03-disable-swap.yml — Disable swap via the disable-swap role.
# ----------------------------------------------------------------------------
# Thin wrapper that invokes the disable-swap role on all K8s nodes.
# The actual logic lives in roles/disable-swap/.
# ============================================================================

- name: Disable swap on all nodes
  hosts: k8s_cluster
  become: true
  gather_facts: true   # Required: role uses ansible_facts['swaptotal_mb']

  roles:
    - disable-swap

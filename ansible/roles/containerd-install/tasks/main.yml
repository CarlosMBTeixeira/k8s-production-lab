---
# ============================================================================
# tasks/main.yml — Install containerd via the Docker official apt repository.
# ----------------------------------------------------------------------------
# Steps:
#   1. Ensure prerequisites for HTTPS apt (ca-certificates, curl, gnupg).
#   2. Create the /etc/apt/keyrings directory.
#   3. Download and install the Docker GPG key.
#   4. Remove the legacy /etc/apt/sources.list.d/docker.list (if present).
#   5. Add the Docker apt repository via deb822 format.
#   6. Refresh apt cache.
#   7. Install containerd.io.
#   8. Ensure the service is running and enabled.
#   9. Verify with 'ctr version'.
# ============================================================================

- name: Install prerequisites for HTTPS apt sources
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ containerd_docker_gpg_url }}"
    dest: "{{ containerd_docker_gpg_keyring }}"
    mode: '0644'
    owner: root
    group: root

- name: Remove legacy Docker apt list file (replaced by .sources)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  notify: Refresh apt cache

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "{{ containerd_docker_repo_url }}"
    suites: "{{ ansible_facts['lsb']['codename'] }}"
    components: stable
    architectures: "{{ ansible_facts['architecture'] | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}"
    signed_by: "{{ containerd_docker_gpg_keyring }}"
    state: present
    enabled: true
  notify: Refresh apt cache

- name: Flush handlers (refresh cache now, before apt install needs it)
  ansible.builtin.meta: flush_handlers

- name: Install containerd.io
  ansible.builtin.apt:
    name: "containerd.io{{ '=' + containerd_version if containerd_version else '' }}"
    state: present

- name: Ensure containerd service is running and enabled
  ansible.builtin.systemd_service:
    name: containerd
    state: "{{ containerd_service_state }}"
    enabled: "{{ containerd_service_enabled }}"

- name: Verify containerd is responding
  ansible.builtin.command: ctr version
  register: ctr_version_check
  changed_when: false
  failed_when: ctr_version_check.rc != 0

- name: Confirm containerd installation
  ansible.builtin.debug:
    msg: "containerd installed and running on {{ inventory_hostname }}"

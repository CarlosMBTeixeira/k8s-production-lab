---
# ============================================================================
# tasks/main.yml — Apply kernel prerequisites for Kubernetes.
# ----------------------------------------------------------------------------
# These tasks are the same as the original 04-kernel-prereqs.yml playbook,
# but parameterized through the role's defaults/main.yml.
#
# Used by: the calling playbook (typically site.yml or a slim wrapper).
# ============================================================================

- name: Load required kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ kernel_prereqs_modules }}"

- name: Persist module loading across reboots
  ansible.builtin.copy:
    dest: "{{ kernel_prereqs_modules_file }}"
    content: |
      {% for module in kernel_prereqs_modules %}
      {{ module }}
      {% endfor %}
    owner: root
    group: root
    mode: '0644'

- name: Configure sysctl parameters for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ kernel_prereqs_sysctl_file }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ kernel_prereqs_sysctls }}"

- name: Verify modules are loaded
  ansible.builtin.shell: "lsmod | grep -E '^({{ kernel_prereqs_modules | join('|') }})\\b'"
  register: lsmod_check
  changed_when: false
  failed_when: lsmod_check.rc != 0

- name: Verify sysctl values are applied
  ansible.builtin.command: "sysctl -n {{ item.name }}"
  register: sysctl_check
  changed_when: false
  failed_when: sysctl_check.stdout.strip() != item.value
  loop: "{{ kernel_prereqs_sysctls }}"

- name: Confirm all kernel prerequisites satisfied
  ansible.builtin.debug:
    msg: "Kernel prerequisites satisfied on {{ inventory_hostname }}"

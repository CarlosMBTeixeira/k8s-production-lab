---
# ============================================================================
# tasks/main.yml — Bootstrap the K8s cluster on the primary control plane.
# ----------------------------------------------------------------------------
# Idempotency strategy: the role checks for /etc/kubernetes/admin.conf
# before doing anything destructive. If present, the cluster is assumed
# already bootstrapped and all kubeadm-related tasks skip.
#
# To force re-bootstrap, run on cp-1 manually:
#   sudo kubeadm reset --force
#   sudo rm -rf /etc/kubernetes/* /etc/cni/net.d /var/lib/kubelet/* /var/lib/etcd
# Then re-run this role.
#
# HA UPDATE: 'kubeadm init' already ran with --upload-certs (below), so
# the control-plane certs are uploaded as a Secret at init time. This role
# now also (re)generates a fresh certificate-key on every run via
# 'kubeadm init phase upload-certs --upload-certs' (same pattern as the
# worker join token: always regenerate rather than parse it out of the
# original init log) and saves the full 'kubeadm join --control-plane ...'
# command to kubeadm_init_join_command_controlplane, consumed by
# playbooks/11-controlplane-join.yml.
# ============================================================================

- name: Check if cluster is already initialized
  ansible.builtin.stat:
    path: "{{ kubeadm_init_admin_conf }}"
  register: kubeadm_init_admin_conf_stat

- name: Render kubeadm configuration from template
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: "{{ kubeadm_init_config_file }}"
    owner: root
    group: root
    mode: '0644'
  when: not kubeadm_init_admin_conf_stat.stat.exists

- name: Run kubeadm init
  ansible.builtin.command:
    cmd: "kubeadm init --config={{ kubeadm_init_config_file }} --upload-certs"
  register: kubeadm_init_output
  when: not kubeadm_init_admin_conf_stat.stat.exists
  changed_when: true

- name: Display kubeadm init output (for first-run visibility)
  ansible.builtin.debug:
    var: kubeadm_init_output.stdout_lines
  when:
    - not kubeadm_init_admin_conf_stat.stat.exists
    - kubeadm_init_output.stdout_lines is defined

- name: Generate worker join command (canonical kubeadm output)
  ansible.builtin.command: kubeadm token create --print-join-command
  register: kubeadm_init_join_cmd_output
  changed_when: false

- name: Save worker join command to disk
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # Generated by Ansible role kubeadm-init on {{ ansible_facts['date_time']['iso8601'] }}
      # Run this command on a worker node to join the cluster.
      # Token expires 24h after generation; regenerate with:
      #   sudo kubeadm token create --print-join-command
      sudo {{ kubeadm_init_join_cmd_output.stdout }}
    dest: "{{ kubeadm_init_join_command_worker }}"
    owner: root
    group: root
    mode: '0700'

# --- HA: control-plane join command (cp-2, future cp-3, ...) ---------------

- name: Generate a fresh certificate key for control-plane join
  ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
  register: kubeadm_init_certkey_output
  changed_when: false

- name: Extract certificate key from upload-certs output
  ansible.builtin.set_fact:
    kubeadm_init_certificate_key: "{{ kubeadm_init_certkey_output.stdout_lines[-1] | trim }}"

- name: Generate control-plane join command (base, without cert key)
  ansible.builtin.command: kubeadm token create --print-join-command
  register: kubeadm_init_cp_join_base
  changed_when: false

- name: Save control-plane join command to disk
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # Generated by Ansible role kubeadm-init on {{ ansible_facts['date_time']['iso8601'] }}
      # Run this command on a SECONDARY control plane node (e.g. cp-2) to
      # join it as an additional control plane (etcd member + its own
      # apiserver/scheduler/controller-manager).
      #
      # Certificate key is valid 2h from generation; token 24h. If both
      # have expired, re-run this role (or playbooks/09-kubeadm-init.yml)
      # on cp-1 to refresh — idempotent, will NOT re-run 'kubeadm init'.
      sudo {{ kubeadm_init_cp_join_base.stdout }} --control-plane --certificate-key {{ kubeadm_init_certificate_key }}
    dest: "{{ kubeadm_init_join_command_controlplane }}"
    owner: root
    group: root
    mode: '0700'

- name: Ensure .kube directory exists for the Ansible user
  ansible.builtin.file:
    path: "/home/{{ kubeadm_init_kubeconfig_user }}/.kube"
    state: directory
    owner: "{{ kubeadm_init_kubeconfig_user }}"
    group: "{{ kubeadm_init_kubeconfig_user }}"
    mode: '0755'

- name: Copy admin kubeconfig to the Ansible user's home
  ansible.builtin.copy:
    src: "{{ kubeadm_init_admin_conf }}"
    dest: "/home/{{ kubeadm_init_kubeconfig_user }}/.kube/config"
    remote_src: true
    owner: "{{ kubeadm_init_kubeconfig_user }}"
    group: "{{ kubeadm_init_kubeconfig_user }}"
    mode: '0600'

- name: Ensure .kube directory exists for extra users
  ansible.builtin.file:
    path: "/home/{{ item }}/.kube"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0755'
  loop: "{{ kubeadm_init_extra_kubeconfig_users }}"

- name: Copy admin kubeconfig to extra users' home directories
  ansible.builtin.copy:
    src: "{{ kubeadm_init_admin_conf }}"
    dest: "/home/{{ item }}/.kube/config"
    remote_src: true
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0600'
  loop: "{{ kubeadm_init_extra_kubeconfig_users }}"

- name: Verify cluster is responding (kubectl get nodes)
  ansible.builtin.command: kubectl get nodes
  become_user: "{{ kubeadm_init_kubeconfig_user }}"
  register: kubectl_get_nodes
  changed_when: false
  failed_when: kubectl_get_nodes.rc != 0

- name: Display node status (control plane should be NotReady without CNI)
  ansible.builtin.debug:
    var: kubectl_get_nodes.stdout_lines

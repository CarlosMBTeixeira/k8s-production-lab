# ============================================================================
# K8s lab inventory — defines the four lab VMs and their groupings.
# ----------------------------------------------------------------------------
# Hosts are referenced by SSH aliases (cp-1, cp-2, w-1, w-2) resolved via
# ~/.ssh/config, which is managed by scripts/sync-ssh-config.sh. This
# decouples the inventory from the actual IPs assigned by Multipass —
# IPs change between daemon restarts, but the aliases are stable.
# ============================================================================


# --- Group: controlplane_primary ---------------------------------------------
# The FIRST control plane node, where 'kubeadm init' runs. Only one node
# bootstraps the cluster; the others (cp-2, future cp-3) join later via
# 'kubeadm join --control-plane'. Calico and other cluster-wide manifests
# are also applied here (since kubectl needs to talk to the API server, and
# this node has admin.conf locally).
[controlplane_primary]
cp-1


# --- Group: controlplane_secondary -------------------------------------------
# Additional control plane nodes that join the cluster after the primary
# bootstraps it. Currently has cp-2; future HA will add cp-3 here.
# Listed as a separate group so playbooks can target it without conditional
# logic (e.g. 'kubeadm join --control-plane' role applies only here).
[controlplane_secondary]
cp-2


# --- Group: controlplane (meta) ----------------------------------------------
# Union of primary + secondary control plane nodes. Use this group in roles
# that apply to ALL control plane nodes (e.g. installing containerd, K8s
# binaries, kernel sysctls — anything that's NOT cluster bootstrap).
[controlplane:children]
controlplane_primary
controlplane_secondary


# --- Group: workers ----------------------------------------------------------
# Future Kubernetes worker nodes. Will join the cluster via 'kubeadm join'
# and run application workloads through the kubelet.
[workers]
w-1
w-2


# --- Meta-group: k8s_cluster -------------------------------------------------
# Combines controlplane + workers. Use this group in playbooks when a task
# applies to every node in the lab (e.g. installing containerd, configuring
# sysctl, applying kernel modules).
[k8s_cluster:children]
controlplane
workers


# --- Variables applied to all nodes in k8s_cluster ---------------------------
# These propagate to both controlplane and workers via the :children meta-group.
[k8s_cluster:vars]
# SSH username on the target VMs. Initially 'ubuntu' (created by cloud-init);
# will be switched to 'ansible' after the 02-ansible-user.yml playbook runs.
ansible_user=ansible

# Path to the private SSH key dedicated to the lab. Never reused for any
# other system. Matches the public key embedded in the cloud-init template.
ansible_ssh_private_key_file=~/.ssh/k8slab

# Pin the Python interpreter on the target to avoid Ansible's auto-discovery
# logic. /usr/bin/python3 is guaranteed to exist on Ubuntu 24.04. Avoids
# both the discovery overhead and the deprecation warning Ansible prints
# when relying on auto-detection.
ansible_python_interpreter=/usr/bin/python3

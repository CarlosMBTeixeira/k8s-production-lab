# App-of-Apps root. This is the only Application ever kubectl-applied by
# hand — every other Application is defined under gitops/apps/root/ in
# this same repo and reaches the cluster via this Application's own sync,
# never a direct kubectl apply.
#
# Source is THIS repository on feature/argo-and-observability-study:
# desired state (gitops/) lives beside infra-as-code (scripts/, ansible/)
# for this study block, so there is one folder and one clone. See
# workbook/README.md for why, and gitops/README.md for the layout.
#
# The separate k8s-gitops repo referenced by docs/argocd-learning-path/
# was never used and is out of scope here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CarlosMBTeixeira/k8s-production-lab.git
    targetRevision: feature/argo-and-observability-study
    path: gitops/apps/root
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

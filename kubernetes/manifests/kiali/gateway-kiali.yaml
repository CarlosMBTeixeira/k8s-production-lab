apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kiali
  namespace: istio-system
spec:
  # Envoy Gateway, like every other lab UI (ADR-026). Istio's own
  # `istio` GatewayClass is used only for mesh ingress (Bookinfo).
  gatewayClassName: eg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: kiali-tls

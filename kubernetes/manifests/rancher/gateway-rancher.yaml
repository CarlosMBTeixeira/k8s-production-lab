# Dedicated Gateway for Rancher — hand-authored, unlike gateway_api_metallb/
# (which is re-downloaded from upstream on every run). See ADR-026.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rancher
  namespace: cattle-system
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: rancher.lab
      tls:
        mode: Terminate
        certificateRefs:
          - name: rancher-tls

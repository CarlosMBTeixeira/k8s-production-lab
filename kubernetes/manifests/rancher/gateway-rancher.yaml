# Dedicated Gateway for Rancher — hand-authored, unlike gateway_api_metallb/
# (which is re-downloaded from upstream on every run). See ADR-026, ADR-029.
# No listener 'hostname': access is via SSH tunnel + localhost, not a real
# DNS name, so SNI/Host matching on a fixed hostname only adds friction.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rancher
  namespace: cattle-system
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: rancher-tls

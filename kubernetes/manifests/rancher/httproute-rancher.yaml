# Routes rancher.lab traffic from Gateway/rancher to the Rancher Service.
# Backend port 80: Rancher's service.disableHTTP defaults to false. See ADR-026.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rancher
  namespace: cattle-system
spec:
  parentRefs:
    - name: rancher
      sectionName: https
  hostnames:
    - rancher.lab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rancher
          port: 80

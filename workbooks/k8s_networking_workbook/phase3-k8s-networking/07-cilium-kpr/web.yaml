# Lab 3.07/3.08 — web (3 replicas) with ClusterIP and NodePort, and a client
# that can run tcpdump on its own interface.
apiVersion: v1
kind: Namespace
metadata: {name: lab-cil}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: lab-cil}
spec:
  replicas: 3
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - {name: whoami, image: "traefik/whoami:v1.10.3", ports: [{name: http, containerPort: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: lab-cil}
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: web-np, namespace: lab-cil}
spec:
  type: NodePort
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: http, nodePort: 30080}]
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: lab-cil, labels: {app: client}}
spec:
  containers:
    - name: netshoot
      image: nicolaka/netshoot:v0.13
      command: ["sleep", "infinity"]
      securityContext: {capabilities: {add: ["NET_ADMIN", "NET_RAW"]}}

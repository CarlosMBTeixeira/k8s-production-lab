# Lab 3.12 — a meshed namespace with STRICT mTLS: web, a meshed client and
# an un-meshed one.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-mesh
  labels: {istio-injection: enabled}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: default, namespace: lab-mesh}
spec:
  mtls: {mode: STRICT}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: lab-mesh}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - {name: whoami, image: "traefik/whoami:v1.10.3", ports: [{name: http, containerPort: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: lab-mesh}
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: http}]     # "http" name → Istio treats it as HTTP
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: client, namespace: lab-mesh}
spec:
  replicas: 1
  selector: {matchLabels: {app: client}}
  template:
    metadata: {labels: {app: client}}
    spec:
      containers:
        - {name: netshoot, image: "nicolaka/netshoot:v0.13", command: ["sleep", "infinity"]}
---
apiVersion: v1
kind: Pod
metadata:
  name: noside
  namespace: lab-mesh
  labels: {app: noside}
  annotations: {sidecar.istio.io/inject: "false"}
spec:
  containers:
    - {name: netshoot, image: "nicolaka/netshoot:v0.13", command: ["sleep", "infinity"]}

# Reference — Cilium's own Gateway API implementation (GatewayClass "cilium").
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: app, namespace: lab-cap}
spec:
  gatewayClassName: cilium
  listeners:
    - {name: http, protocol: HTTP, port: 80, allowedRoutes: {namespaces: {from: Same}}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: app, namespace: lab-cap}
spec:
  parentRefs: [{name: app}]
  hostnames: ["app.lab.local"]
  rules:
    - backendRefs: [{name: frontend, port: 80}]

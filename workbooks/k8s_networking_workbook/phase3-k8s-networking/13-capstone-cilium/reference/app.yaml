# Reference — capstone 3.13 app: three tiers, labelled tier=<x> (policy) and app=<x> (Services).
apiVersion: v1
kind: Namespace
metadata: {name: lab-cap}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: lab-cap}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend, tier: frontend}}
    spec:
      containers: [{name: whoami, image: "traefik/whoami:v1.10.3", args: ["--name", "frontend"], ports: [{name: http, containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: lab-cap}
spec: {selector: {app: frontend}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: lab-cap}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api, tier: api}}
    spec:
      containers: [{name: whoami, image: "traefik/whoami:v1.10.3", args: ["--name", "api"], ports: [{name: http, containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: lab-cap}
spec: {selector: {app: api}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: db, namespace: lab-cap}
spec:
  replicas: 1
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db, tier: db}}
    spec:
      containers: [{name: whoami, image: "traefik/whoami:v1.10.3", args: ["--name", "db", "--port", "5432"], ports: [{name: pg, containerPort: 5432}]}]
---
apiVersion: v1
kind: Service
metadata: {name: db, namespace: lab-cap}
spec: {selector: {app: db}, ports: [{name: pg, port: 5432, targetPort: pg}]}

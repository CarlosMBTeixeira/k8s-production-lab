# Lab 3.01 — a client on worker-1, a server on worker-2 (cross-node),
# and a server on worker-1 (same node).
apiVersion: v1
kind: Namespace
metadata:
  name: lab-anatomy
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: lab-anatomy
  labels: {app: client}
spec:
  nodeSelector: {kubernetes.io/hostname: worker-1}
  containers:
    - name: netshoot
      image: nicolaka/netshoot:v0.13
      command: ["sleep", "infinity"]
      securityContext:
        capabilities: {add: ["NET_ADMIN", "NET_RAW"]}   # tcpdump inside the pod
---
apiVersion: v1
kind: Pod
metadata:
  name: server-remote
  namespace: lab-anatomy
  labels: {app: server}
spec:
  nodeSelector: {kubernetes.io/hostname: worker-2}
  containers:
    - name: whoami
      image: traefik/whoami:v1.10.3
      ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Pod
metadata:
  name: server-local
  namespace: lab-anatomy
  labels: {app: server}
spec:
  nodeSelector: {kubernetes.io/hostname: worker-1}
  containers:
    - name: whoami
      image: traefik/whoami:v1.10.3
      ports: [{containerPort: 80}]

# /shared → a Service in ANOTHER namespace. Needs a ReferenceGrant there (04).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: shared, namespace: lab-gw-apps}
spec:
  parentRefs: [{name: lab-gw, namespace: lab-gw}]
  hostnames: ["web.lab.local"]
  rules:
    - matches: [{path: {type: PathPrefix, value: /shared}}]
      backendRefs: [{name: shared, namespace: lab-gw-other, port: 80}]

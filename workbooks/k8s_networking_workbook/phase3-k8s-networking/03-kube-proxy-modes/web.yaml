# Lab 3.03 — same app in every kind cluster: 3 web replicas, a ClusterIP,
# and a client.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-modes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-modes
spec:
  replicas: 3
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          ports: [{name: http, containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab-modes
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: lab-modes
spec:
  containers:
    - {name: netshoot, image: "nicolaka/netshoot:v0.13", command: ["sleep", "infinity"]}

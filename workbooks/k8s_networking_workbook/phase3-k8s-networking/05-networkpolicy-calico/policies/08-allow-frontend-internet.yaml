# frontend may reach the internet on 80/443 — anything outside the pod and Service CIDRs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-frontend-internet, namespace: lab-np-front}
spec:
  podSelector: {matchLabels: {app: frontend}}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [192.168.0.0/16, 10.96.0.0/12]
      ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 443}

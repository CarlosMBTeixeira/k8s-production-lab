# Lab 3.02 — a 3-replica web Deployment spread over both workers, a
# ClusterIP Service, a NodePort Service and one client pod per worker.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-svc
spec:
  replicas: 3
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor   # else the tainted control planes count as empty domains: replica 3 stays Pending
          labelSelector:
            matchLabels: {app: web}
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          ports: [{name: http, containerPort: 80}]
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab-svc
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: web-np
  namespace: lab-svc
spec:
  type: NodePort
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: http, nodePort: 30080}]
---
apiVersion: v1
kind: Pod
metadata:
  name: client-w1
  namespace: lab-svc
spec:
  nodeSelector: {kubernetes.io/hostname: worker-1}
  containers:
    - {name: netshoot, image: "nicolaka/netshoot:v0.13", command: ["sleep", "infinity"]}
---
apiVersion: v1
kind: Pod
metadata:
  name: client-w2
  namespace: lab-svc
spec:
  nodeSelector: {kubernetes.io/hostname: worker-2}
  containers:
    - {name: netshoot, image: "nicolaka/netshoot:v0.13", command: ["sleep", "infinity"]}

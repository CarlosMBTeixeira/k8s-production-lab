# Lab 3.04 — things to resolve: a normal Service, a headless Service with a
# StatefulSet behind it, and two clients (default ndots:5, and ndots:1).
apiVersion: v1
kind: Namespace
metadata:
  name: lab-dns
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: lab-dns}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - {name: whoami, image: "traefik/whoami:v1.10.3", ports: [{name: http, containerPort: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: lab-dns}
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: db, namespace: lab-dns}
spec:
  clusterIP: None            # headless: DNS returns pod IPs, no VIP
  selector: {app: db}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db, namespace: lab-dns}
spec:
  serviceName: db
  replicas: 2
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
        - {name: whoami, image: "traefik/whoami:v1.10.3", ports: [{containerPort: 80}]}
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: lab-dns}
spec:
  containers:
    - name: netshoot
      image: nicolaka/netshoot:v0.13
      command: ["sleep", "infinity"]
      securityContext: {capabilities: {add: ["NET_ADMIN", "NET_RAW"]}}
---
apiVersion: v1
kind: Pod
metadata: {name: client-ndots1, namespace: lab-dns}
spec:
  dnsConfig:
    options: [{name: ndots, value: "1"}]
  containers:
    - name: netshoot
      image: nicolaka/netshoot:v0.13
      command: ["sleep", "infinity"]
      securityContext: {capabilities: {add: ["NET_ADMIN", "NET_RAW"]}}

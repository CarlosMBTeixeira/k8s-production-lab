# Phase 1 — DNS (drill 08): a CoreDNS server (authoritative for lab.local,
# recursive for everything else) and a client, on 10.53.0.0/24.
# Deploy (netlab-c, root, local copy):  containerlab deploy -t dns.clab.yml && bash dns-setup.sh
name: p1d
topology:
  defaults: {kind: linux}
  nodes:
    dns-net: {image: "nicolaka/netshoot:v0.13", cmd: sleep infinity}
    dns:     {image: "coredns/coredns:1.11.3", network-mode: container:dns-net, binds: [dns/Corefile:/Corefile, dns/lab.local.zone:/lab.local.zone], cmd: -conf /Corefile}
    client:  {image: "nicolaka/netshoot:v0.13", cmd: sleep infinity}
  links:
    - endpoints: ["client:eth1", "dns-net:eth1"]

frr defaults datacenter
hostname hub
log stdout informational
service integrated-vtysh-config
!
interface eth1
 ip address 10.255.1.1/30
interface eth2
 ip address 10.255.2.1/30
interface eth3
 ip address 10.255.3.1/30
!
! The transit hub (TGW / vWAN hub). Learns each spoke's aggregate and
! re-advertises it to every other spoke — full transit, until you segment it.
router bgp 65100
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 10.255.1.2 remote-as 65101
 neighbor 10.255.1.2 description vpc-a
 neighbor 10.255.2.2 remote-as 65102
 neighbor 10.255.2.2 description vpc-b
 neighbor 10.255.3.2 remote-as 65200
 neighbor 10.255.3.2 description on-prem
!

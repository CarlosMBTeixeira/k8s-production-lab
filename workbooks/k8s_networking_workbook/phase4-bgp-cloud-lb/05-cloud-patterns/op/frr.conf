frr defaults datacenter
hostname op
log stdout informational
service integrated-vtysh-config
!
interface eth1
 ip address 10.255.3.2/30
interface eth2
 ip address 172.20.1.1/24
interface eth3
 ip address 172.20.2.1/24
!
! On-prem edge (the VPN / ExpressRoute / Direct Connect side).
ip route 172.20.0.0/16 blackhole
router bgp 65200
 bgp router-id 10.255.3.2
 no bgp ebgp-requires-policy
 neighbor 10.255.3.1 remote-as 65100
 address-family ipv4 unicast
  network 172.20.0.0/16
 exit-address-family
!

frr defaults datacenter
hostname rb
log stdout informational
service integrated-vtysh-config
!
interface eth1
 ip address 10.255.2.2/30
interface eth2
 ip address 10.20.1.1/24
interface eth3
 ip address 10.99.0.2/30
!
! VPC-B router (the provider's VPC). The 10.99.0.0/30 backbone to the
! private endpoint is connected but never announced.
ip route 10.20.0.0/16 blackhole
router bgp 65102
 bgp router-id 10.255.2.2
 no bgp ebgp-requires-policy
 neighbor 10.255.2.1 remote-as 65100
 address-family ipv4 unicast
  network 10.20.0.0/16
 exit-address-family
!

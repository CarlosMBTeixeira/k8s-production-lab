# Lab 4.01 — three eBGP routers, two hosts.
#
#   h1 ── r1 (AS65001) ── r2 (AS65002) ── r3 (AS65003) ── h2
#           └────────────── direct link ──────┘   (no BGP session at first)
#
# Deploy on netlab-c:  sudo containerlab deploy -t topo.clab.yml
# Every link is pinned to MTU 1500 (Containerlab defaults to 9500), so the
# fragmentation, PMTUD and OSPF-MTU drills see real-Ethernet numbers.
name: bgp
topology:
  defaults:
    kind: linux
  nodes:
    r1:
      image: quay.io/frrouting/frr:10.2.1
      binds: [../lib/daemons:/etc/frr/daemons, ../lib/vtysh.conf:/etc/frr/vtysh.conf, r1/frr.conf:/etc/frr/frr.conf]
      exec: [sysctl -w net.ipv4.ip_forward=1]
    r2:
      image: quay.io/frrouting/frr:10.2.1
      binds: [../lib/daemons:/etc/frr/daemons, ../lib/vtysh.conf:/etc/frr/vtysh.conf, r2/frr.conf:/etc/frr/frr.conf]
      exec: [sysctl -w net.ipv4.ip_forward=1]
    r3:
      image: quay.io/frrouting/frr:10.2.1
      binds: [../lib/daemons:/etc/frr/daemons, ../lib/vtysh.conf:/etc/frr/vtysh.conf, r3/frr.conf:/etc/frr/frr.conf]
      exec: [sysctl -w net.ipv4.ip_forward=1]
    h1:
      image: nicolaka/netshoot:v0.13
      exec: ["ip addr add 172.16.1.10/24 dev eth1", "ip route add 172.16.0.0/16 via 172.16.1.1"]
    h2:
      image: nicolaka/netshoot:v0.13
      exec: ["ip addr add 172.16.3.10/24 dev eth1", "ip route add 172.16.0.0/16 via 172.16.3.1"]
  links:
    - {endpoints: ["r1:eth1", "r2:eth1"], mtu: 1500}     # 10.0.12.0/24
    - {endpoints: ["r2:eth2", "r3:eth1"], mtu: 1500}     # 10.0.23.0/24
    - {endpoints: ["r1:eth2", "r3:eth2"], mtu: 1500}     # 10.0.13.0/24
    - {endpoints: ["r1:eth3", "h1:eth1"], mtu: 1500}     # 172.16.1.0/24
    - {endpoints: ["r3:eth3", "h2:eth1"], mtu: 1500}     # 172.16.3.0/24

# Lab 4.06 — web behind a ClusterIP (L4) and behind an Envoy (L7) that
# load-balances per request over a headless Service.
apiVersion: v1
kind: Namespace
metadata: {name: lab-l7}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: lab-l7}
spec:
  replicas: 3
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers: [{name: whoami, image: "traefik/whoami:v1.10.3", ports: [{name: http, containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: lab-l7}
spec: {selector: {app: web}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: v1
kind: Service
metadata: {name: web-headless, namespace: lab-l7}
spec: {clusterIP: None, selector: {app: web}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: envoy, namespace: lab-l7}
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: http
          address: {socket_address: {address: 0.0.0.0, port_value: 10000}}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
                    route_config:
                      virtual_hosts:
                        - name: web
                          domains: ["*"]
                          routes: [{match: {prefix: "/"}, route: {cluster: web}}]
      clusters:
        - name: web
          type: STRICT_DNS                 # resolve the headless Service: one endpoint per pod
          dns_refresh_rate: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: web
            endpoints:
              - lb_endpoints:
                  - endpoint: {address: {socket_address: {address: web-headless.lab-l7.svc.cluster.local, port_value: 80}}}
    admin:
      address: {socket_address: {address: 127.0.0.1, port_value: 9901}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: envoy, namespace: lab-l7}
spec:
  replicas: 1
  selector: {matchLabels: {app: envoy}}
  template:
    metadata: {labels: {app: envoy}}
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.32.1
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports: [{containerPort: 10000}]
          volumeMounts: [{name: cfg, mountPath: /etc/envoy}]
      volumes: [{name: cfg, configMap: {name: envoy}}]
---
apiVersion: v1
kind: Service
metadata: {name: envoy, namespace: lab-l7}
spec: {selector: {app: envoy}, ports: [{port: 10000, targetPort: 10000}]}
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: lab-l7}
spec:
  containers: [{name: netshoot, image: "nicolaka/netshoot:v0.13", command: ["sleep", "infinity"]}]

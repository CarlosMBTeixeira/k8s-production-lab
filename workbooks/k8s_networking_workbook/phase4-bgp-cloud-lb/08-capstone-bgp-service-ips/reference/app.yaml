apiVersion: v1
kind: Namespace
metadata: {name: lab-cap4}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: lab-cap4}
spec:
  replicas: 3
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers: [{name: whoami, image: "traefik/whoami:v1.10.3", ports: [{name: http, containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: lab-cap4}
spec:
  selector: {app: web}
  externalIPs: [10.202.0.20]
  externalTrafficPolicy: Local
  ports: [{name: http, port: 80, targetPort: http}]

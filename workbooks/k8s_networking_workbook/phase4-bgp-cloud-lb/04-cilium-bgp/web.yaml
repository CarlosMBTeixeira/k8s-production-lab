apiVersion: v1
kind: Namespace
metadata: {name: lab-cbgp}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: lab-cbgp}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers: [{name: whoami, image: "traefik/whoami:v1.10.3", ports: [{name: http, containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab-cbgp
  labels: {bgp-advertise: "true"}
spec:
  type: LoadBalancer
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: http}]

# kind cluster "lab-ipvs" — kindnet CNI, kube-proxy in IPVS mode (lab 3.03)
# Create:  kind create cluster --config setup/kind/kube-proxy-ipvs.yaml
# Delete:  kind delete cluster --name lab-ipvs
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab-ipvs
nodes:
  - role: control-plane
  - role: worker
  - role: worker
networking:
  kubeProxyMode: ipvs

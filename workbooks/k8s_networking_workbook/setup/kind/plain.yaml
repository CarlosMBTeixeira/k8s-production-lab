# kind cluster "lab-plain" — kindnet CNI, kube-proxy iptables (labs 4.02, 4.06)
# Create:  kind create cluster --config setup/kind/plain.yaml
# Delete:  kind delete cluster --name lab-plain
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab-plain
nodes:
  - role: control-plane
  - role: worker
  - role: worker
networking:
  kubeProxyMode: iptables
